<style>
/* Layout: sticky control bar over a single reading column; one lesson section at a time, tools and tasks inline, results card at the end. */
:root{
  --bg:#eef1f4; --surface:#ffffff; --fg:#14202b; --muted:#5a6b79; --line:#cfd8df;
  --accent:#0b6e6e; --accent-fg:#ffffff; --accent-soft:#dcefee; --signal:#a85f00; --ok:#1f7a3d; --ok-soft:#e1f3e7; --bad:#b3261e; --bad-soft:#fbe6e4;

}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1a22; --surface:#16252f; --fg:#e4ecf1; --muted:#93a5b2; --line:#2a3d4a;
  --accent:#4fc3be; --accent-fg:#0f1a22; --accent-soft:#16363a; --signal:#f0a63a; --ok:#6fcf8f; --ok-soft:#173526; --bad:#ff8a80; --bad-soft:#41201f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1a22; --surface:#16252f; --fg:#e4ecf1; --muted:#93a5b2; --line:#2a3d4a;
  --accent:#4fc3be; --accent-fg:#0f1a22; --accent-soft:#16363a; --signal:#f0a63a; --ok:#6fcf8f; --ok-soft:#173526; --bad:#ff8a80; --bad-soft:#41201f; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:calc(16px * var(--scale,1));line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--surface);border-bottom:1px solid var(--line);
  margin-left:calc(-1 * max(16px,env(safe-area-inset-left,0px)));margin-right:calc(-1 * max(16px,env(safe-area-inset-right,0px)));
  padding:8px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px))}
.bar-in{max-width:780px;margin:0 auto;display:flex;flex-direction:column;gap:6px}
.bar-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.brand{font-weight:600;font-size:.95em;margin-right:auto}
.meta{color:var(--muted);font-size:.82em}
.prog{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.prog>i{display:block;height:100%;width:0;background:var(--accent);transition:width .25s}
.timer{font-family:var(--font-mono);font-size:.9em;min-width:3.6em;text-align:center}
.tl{display:inline-flex;align-items:center;gap:6px}
select{font:inherit;font-size:.85em;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:4px 6px}
button{font:inherit;font-weight:500;cursor:pointer;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:.45em .9em}
button.small{padding:.25em .6em;font-size:.85em}
button.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
button:disabled{opacity:.5;cursor:not-allowed}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{max-width:780px;margin:0 auto;padding-top:16px;position:relative}
#menu{position:absolute;z-index:8;left:0;right:0;top:6px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px;box-shadow:0 8px 24px rgba(0,0,0,.18)}
#menu button{display:flex;width:100%;gap:10px;text-align:left;border:0;padding:.5em .6em;background:transparent}
#menu button[aria-current="true"]{background:var(--accent-soft);color:var(--accent)}
#menu .mt{margin-left:auto;color:var(--muted);font-size:.85em;white-space:nowrap}
.sec{display:flex;flex-direction:column;gap:14px}
.sec>h2{font-size:1.45em;line-height:1.2;margin:0;text-wrap:balance}
.badge{font-size:.8em;color:var(--muted);font-family:var(--font-mono);letter-spacing:.03em}
.sec p{margin:0;max-width:68ch}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card h3{margin:0;font-size:1.05em}
.goal{background:var(--accent-soft);border-radius:8px;padding:12px 14px}
.goal ul{margin:6px 0 0;padding-left:1.2em}
.nums{font-family:var(--font-mono);font-size:1.4em;font-weight:600;color:var(--signal);letter-spacing:.06em;word-spacing:.35em}
.defs{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.defs .card b{color:var(--accent)}
.chain{display:flex;gap:6px;align-items:stretch;flex-wrap:wrap}
.chain>span{flex:1 1 110px;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px;text-align:center;font-size:.9em;position:relative;min-width:0}
.chain>span.code{border-color:var(--accent);background:var(--accent-soft)}
.label{font-size:.75em;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;display:block;margin-bottom:4px}
input[type=text],input[type=number],textarea{width:100%;font:inherit;font-family:var(--font-mono);color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:.55em .7em}
textarea{min-height:4.6em;resize:vertical}
.trow{display:flex;gap:8px;flex-wrap:wrap}.trow input{flex:1 1 180px;min-width:0}
.row2{display:flex;gap:12px;flex-wrap:wrap}.row2>*{flex:1 1 180px;min-width:0}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.out{font-family:var(--font-mono);font-size:1.1em;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:.6em .7em;min-height:2.8em;word-break:break-word;color:var(--signal);font-weight:500}
.task,.q{border-top:1px dashed var(--line);padding-top:12px;display:flex;flex-direction:column;gap:8px}
.qtext{font-weight:500}
.opts{display:flex;flex-direction:column;gap:6px}
.opt{text-align:left;background:var(--surface)}
.opt.right{background:var(--ok-soft);border-color:var(--ok)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad)}
.fb{min-height:1.2em;font-size:.95em}
.good{color:var(--ok)}.badc{color:var(--bad)}
.hint{font-size:.9em;color:var(--muted)}
.note{border-left:3px solid var(--signal);padding:2px 0 2px 12px;font-size:.95em}
.alpha{font-family:var(--font-mono);font-size:.85em;white-space:pre;overflow-x:auto;padding:8px;background:var(--bg);border-radius:6px}
details summary{cursor:pointer;color:var(--accent);font-weight:500}
.morse{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:4px;font-family:var(--font-mono);font-size:.85em}
.morse span{background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:3px 7px;display:flex;justify-content:space-between;gap:6px}
.morse b{color:var(--accent)}
.bits{display:grid;gap:6px}
.bits button{font-family:var(--font-mono);font-size:1.3em;width:100%;padding:.4em 0}
.bits button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.bits small{display:block;text-align:center;font-family:var(--font-mono);font-size:.75em;color:var(--muted)}
.big{font-family:var(--font-mono);font-size:1.9em;font-weight:600;color:var(--accent);line-height:1.2}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-family:var(--font-mono);font-size:.9em}
td,th{padding:5px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap;font-variant-numeric:tabular-nums}
.pool,.slots{display:flex;gap:6px;flex-wrap:wrap;min-height:2.6em;padding:8px;border:1px dashed var(--line);border-radius:6px}
.slots button{background:var(--accent-soft);border-color:var(--accent)}
.cls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between;padding:6px 0;border-top:1px dashed var(--line)}
.cls .btns button.right{background:var(--ok-soft);border-color:var(--ok)}
.cls .btns button.wrong{background:var(--bad-soft);border-color:var(--bad)}
.robot{display:grid;grid-template-columns:1fr 6em;gap:6px 10px;align-items:center}
.robot input{text-align:center;letter-spacing:.15em}
.lines{display:flex;flex-direction:column;gap:6px}
.lines button{text-align:left}
.lines button.right{background:var(--ok-soft);border-color:var(--ok)}
.lines button.wrong{background:var(--bad-soft);border-color:var(--bad)}
.res{border:2px solid var(--accent);border-radius:10px;background:var(--surface);padding:18px;display:flex;flex-direction:column;gap:12px}
.res h3{margin:0;font-size:1.1em}
.score{font-family:var(--font-mono);font-size:2.8em;font-weight:600;color:var(--accent);line-height:1}
.nav{display:flex;justify-content:space-between;gap:8px;margin-top:20px}
@media (prefers-reduced-motion:reduce){.prog>i{transition:none}}
</style>

<div class="bar"><div class="bar-in">
  <div class="bar-row">
    <button class="small" id="btn-menu" aria-expanded="false" aria-label="Меню розділів">☰ Розділи</button>

<script>
(function(){
var $=function(s,r){return (r||document).querySelector(s)};
function h(tag,cls,html){var e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
var KEY="kod-lesson-v1";
function load(){var r=null;
  try{r=JSON.parse(localStorage.getItem(KEY)||"null")}catch(e){}
  if(!r||!r.done){try{r=JSON.parse(sessionStorage.getItem(KEY)||"null")}catch(e){}}
  if(!r||!r.done){try{var n=JSON.parse(window.name||"null");if(n&&n.k===KEY)r=n.v}catch(e){}}
  return r||{}}
var S=load();S.done=S.done||[];S.tasks=S.tasks||{};
function save(){var j=JSON.stringify(S);
  try{localStorage.setItem(KEY,j)}catch(e){}
  try{sessionStorage.setItem(KEY,j)}catch(e){}
  try{window.name=JSON.stringify({k:KEY,v:S})}catch(e){}}

var A="АБВГҐДЕЄЖЗИІЇЙКЛМНОПРСТУФХЦЧШЩЬЮЯ";
var M={"А":".-","Б":"-...","В":".--","Г":"....","Ґ":"--.","Д":"-..","Е":".","Є":"..-..","Ж":"...-","З":"--..","И":"-.--","І":"..","Ї":".---.","Й":".---","К":"-.-","Л":".-..","М":"--","Н":"-.","О":"---","П":".--.","Р":".-.","С":"...","Т":"-","У":"..-","Ф":"..-.","Х":"----","Ц":"-.-.","Ч":"---.","Ь":"-..-","Ю":"..--","Я":".-.-"};
var MR={};Object.keys(M).forEach(function(k){MR[M[k]]=k});
function mEnc(t){return t.toUpperCase().split(/\s+/).filter(Boolean).map(function(w){return w.split("").map(function(c){return M[c]||"?"}).join(" ")}).join(" / ")}
function mDec(t){return t.trim().split(/\s*\/\s*/).map(function(w){return w.trim().split(/\s+/).filter(Boolean).map(function(c){return MR[c]||"?"}).join("")}).join(" ")}
function shift(t,k){return t.toUpperCase().split("").map(function(c){var i=A.indexOf(c);return i<0?c:A[(i+k+A.length*3)%A.length]}).join("")}
function pad(n,len){var s=n.toString(2);while(s.length<len)s="0"+s;return s}
function need(n){var b=0;while(Math.pow(2,b)<n)b++;return Math.max(b,1)}

/* tasks */
var tCount=0;
function reg(){tCount++;return "t"+tCount}
function pass(id){S.tasks[id]=1;save()}
function mcq(parent,o){
  var box=h("div","q");box.appendChild(h("p","qtext",o.q));
  var list=h("div","opts"),fb=h("p","fb");
  var items=shuffle(o.opts.map(function(t,i){return {t:t,c:i===o.ok}}));
  items.forEach(function(it,idx){
    var b=h("button","opt",it.t);b.type="button";
    b.onclick=function(){
      if(box.dataset.done)return;box.dataset.done="1";
      Array.prototype.forEach.call(list.children,function(x){x.disabled=true});
      b.classList.add(it.c?"right":"wrong");
      if(!it.c){items.forEach(function(j,k){if(j.c)list.children[k].classList.add("right")})}
      fb.className="fb "+(it.c?"good":"badc");
      fb.textContent=(it.c?"Правильно. ":"Неправильно. ")+(o.why||"");
      if(o.cb)o.cb(it.c)};
    list.appendChild(b)});
  box.appendChild(list);box.appendChild(fb);parent.appendChild(box);return box}
function practiceMcq(parent,o){var id=reg();o.cb=function(c){if(c)pass(id)};return mcq(parent,o)}
function task(parent,o){
  var id=reg(),box=h("div","task");box.appendChild(h("p","qtext",o.q));
  var row=h("div","trow"),inp=h("input");inp.type="text";inp.placeholder=o.ph||"Твоя відповідь";inp.autocomplete="off";inp.spellcheck=false;inp.setAttribute("aria-label","Відповідь");
  var btn=h("button","primary","Перевірити");btn.type="button";
  var fb=h("p","fb");
  var norm=o.norm||function(s){return s.trim().toUpperCase().replace(/\s+/g," ")};
  btn.onclick=function(){
    var v=norm(inp.value);
    if(o.ans.some(function(a){return norm(a)===v})){fb.className="fb good";fb.textContent="Правильно. "+(o.why||"");pass(id)}
    else{fb.className="fb badc";fb.textContent=o.hint||"Ще ні. Перевір і спробуй ще раз."}};
  inp.addEventListener("keydown",function(e){if(e.key==="Enter")btn.click()});
  row.appendChild(inp);row.appendChild(btn);box.appendChild(row);box.appendChild(fb);parent.appendChild(box);return box}

var SECS=[];
function sec(title,min,build){SECS.push({title:title,min:min,build:build})}

/* 1 */
sec("Розшифруй повідомлення",3,function(c){
  var g=h("div","goal","<b>Що ти зможеш після уроку</b><ul><li>пояснити, що таке код, кодування й декодування;</li><li>назвати ланки передавання повідомлення;</li><li>закодувати слово азбукою Морзе та двійковим кодом;</li><li>створити власну систему кодування й відрізняти кодування від шифрування.</li></ul>");
  var who=h("div","card");who.appendChild(h("h3",null,"Хто виконує урок"));
  var wr=h("div","row2"),wa=h("div",null,"<span class='label'>Прізвище та ім’я</span>"),wi=h("input");wi.type="text";wi.value=S.name||"";wi.autocomplete="name";wi.setAttribute("aria-label","Прізвище та ім’я");wa.appendChild(wi);
  var wb=h("div",null,"<span class='label'>Клас</span>"),wk=h("input");wk.type="text";wk.value=S.klass||"";wk.setAttribute("aria-label","Клас");wb.appendChild(wk);
  wi.oninput=function(){S.name=wi.value;save()};wk.oninput=function(){S.klass=wk.value;save()};
  wr.appendChild(wa);wr.appendChild(wb);who.appendChild(wr);who.appendChild(h("p","hint","Ці дані потраплять у звіт наприкінці уроку, який треба надіслати вчителю або вчительці."));
  c.appendChild(who);
  c.appendChild(g);
  c.appendChild(h("p",null,"Починаємо з загадки. Ось повідомлення, записане числами. Підказка: це слово з назви нашого предмета."));
  c.appendChild(h("div","nums","12 18 25 19 21 17 1 23 11 15 1"));
  var d=h("details",null,"<summary>Показати нумерацію літер</summary><div class='alpha'>1 А   2 Б   3 В   4 Г   5 Ґ   6 Д   7 Е   8 Є   9 Ж  10 З  11 И\n12 І  13 Ї  14 Й  15 К  16 Л  17 М  18 Н  19 О  20 П  21 Р  22 С\n23 Т  24 У  25 Ф  26 Х  27 Ц  28 Ч  29 Ш  30 Щ  31 Ь  32 Ю  33 Я</div>");
  c.appendChild(d);
  task(c,{q:"Яке слово зашифровано?",ans:["ІНФОРМАТИКА"],ph:"Слово великими літерами",hint:"Спробуй замінити кожне число літерою за її номером в алфавіті.",why:"Кожне число — номер літери в українському алфавіті. Ти щойно виконав(ла) декодування."});
  c.appendChild(h("p","note","Щоб прочитати повідомлення, потрібно було знати правило, за яким літери замінили числами. Без правила, тобто без коду, розшифрувати його майже неможливо."))});

/* 2 */
sec("Пригадай",3,function(c){
  c.appendChild(h("p",null,"Три швидкі запитання про те, що ти вже знаєш. Після відповіді з’явиться пояснення."));
  practiceMcq(c,{q:"У якому вигляді комп’ютер зберігає й опрацьовує всі типи даних: числа, текст, звук, зображення, відео?",opts:["У вигляді двійкового коду (нулі й одиниці)","Кожен тип у своєму окремому вигляді","У вигляді десяткових чисел","У вигляді малюнків"],ok:0,why:"Усі типи даних пристрої комп’ютера перетворюють в однотипні сигнали, які записують двійковим кодом."});
  practiceMcq(c,{q:"Яка найменша одиниця кодування?",opts:["Біт","Байт","Кілобайт","Символ"],ok:0,why:"Біт — один двійковий знак (0 або 1). Байт складається з 8 бітів."});
  practiceMcq(c,{q:"Хто може бути передавачем і приймачем повідомлення?",opts:["І жива істота (людина, тварина), і технічний пристрій","Лише людина","Лише комп’ютер","Лише телефон"],ok:0,why:"У розмові двох людей передавач і приймач — люди, у розмові телефоном — ще й пристрої."})});

/* 3 */
sec("Як передають повідомлення",5,function(c){

var testBox=null;
function buildTest(c){
  c.innerHTML="";c.appendChild(h("p",null,"10 запитань, кожне 1 бал. Відповідь перевіряється одразу. Після тесту відкриється звіт про виконану роботу, який треба скопіювати й надіслати вчителю чи вчительці. Максимум — 10 балів."));
  var cnt=h("p","badge");var done=0,score=0,results=[];var zone=h("div","card");
  function upd(){cnt.textContent="Відповідь дано: "+done+" з "+TEST.length+" · балів: "+score}
  upd();c.appendChild(cnt);c.appendChild(zone);
  var end=h("div","card");end.hidden=true;c.appendChild(end);
  TEST.forEach(function(q,i){
    mcq(zone,{q:(i+1)+". "+q.q,opts:q.o,ok:0,why:q.w,cb:function(ok){done++;results[i]=!!ok;if(ok)score++;upd();
      if(done===TEST.length){S.score=score;S.res=results;S.scoreAt=new Date().toISOString();save();
        S.done=S.done||[];if(S.done.indexOf(SECS.length-2)<0){S.done.push(SECS.length-2);save();refresh()}
        end.hidden=false;end.innerHTML="";end.appendChild(h("h3",null,"Тест завершено: "+score+" з "+TEST.length+" балів"));
        var go=h("button","primary","Показати звіт для вчителя");go.type="button";go.onclick=function(){show(SECS.length-1)};
        var re=h("button",null,"Пройти тест ще раз");re.type="button";re.onclick=function(){buildTest(c)};
        var bt=h("div","btns");bt.appendChild(go);bt.appendChild(re);end.appendChild(bt);
        var rp=h("div");rp.style.display="flex";rp.style.flexDirection="column";rp.style.gap="10px";end.appendChild(rp);reportInto(rp);
        if(!S.done||S.done.indexOf(SECS.length-2)<0){S.done=S.done||[];S.done.push(SECS.length-2);save();refresh()}}}})});
}
sec("Підсумковий тест",5,function(c){testBox=c;buildTest(c)});

/* 12 Result */
sec("Звіт для вчителя",1,function(c){c.dataset.result="1"});
function buildResult(c){c.innerHTML="";reportInto(c)}
function reportInto(c){
  var tn=0;for(var k in S.tasks)tn++;
  var date=new Date().toLocaleDateString("uk-UA",{day:"numeric",month:"long",year:"numeric"});
  var L=["Звіт про виконання уроку «Кодування і декодування інформації»","Учень / учениця: "+(S.name||"не вказано"),"Клас: "+(S.klass||"не вказано"),"Дата: "+date];
  if(typeof S.score==="number"){L.push("Підсумковий тест: "+S.score+" з 10 балів");if(S.res)L.push("Відповіді на запитання тесту: "+S.res.map(function(r,i){return (i+1)+(r?" +":" −")}).join(", "))}
  else L.push("Підсумковий тест: не пройдено");
  L.push("Практичних завдань виконано: "+Math.min(tn,tCount)+" з "+tCount);
  L.push("Розділів пройдено: "+S.done.length+" з "+SECS.length);
  var text=L.join("\n");
  c.appendChild(h("p",null,"Скопіюй цей звіт і надішли його вчителю або вчительці."));
  if(!S.name||!S.klass){var w=h("p","note","Прізвище, ім’я або клас не вказано. ");var g=h("button","small","Вказати на початку уроку");g.type="button";g.onclick=function(){show(0)};w.appendChild(g);c.appendChild(w)}
  if(typeof S.score!=="number"){var w2=h("p","note","Тест ще не пройдено. ");var g2=h("button","small","Перейти до тесту");g2.type="button";g2.onclick=function(){show(SECS.length-2)};w2.appendChild(g2);c.appendChild(w2)}
  var ta=h("textarea");ta.readOnly=true;ta.value=text;ta.style.minHeight="11em";ta.setAttribute("aria-label","Текст звіту");c.appendChild(ta);
  var fb=h("p","fb"),cp=h("button","primary","Копіювати звіт");cp.type="button";
  function fallback(){ta.focus();ta.select();var okc=false;try{okc=document.execCommand("copy")}catch(e){}fb.className="fb "+(okc?"good":"hint");fb.textContent=okc?"Скопійовано.":"Виділи текст у полі й скопіюй його вручну."}
  cp.onclick=function(){try{navigator.clipboard.writeText(text).then(function(){fb.className="fb good";fb.textContent="Скопійовано."},fallback)}catch(e){fallback()}};
  c.appendChild(cp);c.appendChild(fb);
}

/* shell */
var cur=0,stage=$("#stage"),secEls=[];
SECS.forEach(function(s,i){var e=h("section","sec");e.hidden=true;e.appendChild(h("h2",null,(i+1)+". "+s.title));e.appendChild(h("span","badge","⏱ "+s.min+" хв"));
  var body=h("div","sec");e.appendChild(body);s.build(body);stage.appendChild(e);secEls.push(e)});
var menu=$("#menu");
function buildMenu(){menu.innerHTML="";SECS.forEach(function(s,i){var b=h("button",null,"<span>"+(S.done.indexOf(i)>=0?"✓":"○")+"</span><span>"+(i+1)+". "+s.title+"</span><span class='mt'>"+s.min+" хв</span>");b.type="button";if(i===cur)b.setAttribute("aria-current","true");b.onclick=function(){show(i);toggleMenu(false)};menu.appendChild(b)})}
function refresh(){var n=S.done.length,p=Math.round(n/SECS.length*100);$("#p-bar").style.width=p+"%";$("[role=progressbar]").setAttribute("aria-valuenow",p);$("#p-text").textContent="Пройдено "+n+" з "+SECS.length+" розділів · "+p+"%";buildMenu()}
function show(i){cur=Math.max(0,Math.min(SECS.length-1,i));secEls.forEach(function(e,k){e.hidden=k!==cur});
  if(cur===SECS.length-1){if(S.done.indexOf(cur)<0){S.done.push(cur);save()}buildResult(secEls[cur].lastChild)}
  $("#b-prev").disabled=cur===0;$("#b-next").disabled=cur===SECS.length-1;
  if(history.replaceState){try{history.replaceState(null,"","#step-"+(cur+1))}catch(e){}}
  S.cur=cur;save();refresh();window.scrollTo(0,0)}
$("#b-prev").onclick=function(){show(cur-1)};
$("#b-next").onclick=function(){if(S.done.indexOf(cur)<0&&cur<SECS.length-2){S.done.push(cur);save()}show(cur+1)};
function toggleMenu(v){menu.hidden=!v;$("#btn-menu").setAttribute("aria-expanded",v?"true":"false")}
$("#btn-menu").onclick=function(){toggleMenu(menu.hidden)};
var sc=[1,1.15,1.3],si=0;$("#btn-font").onclick=function(){si=(si+1)%sc.length;document.body.style.setProperty("--scale",sc[si])};
$("#btn-full").onclick=function(){try{if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen().catch(function(){})}catch(e){}};
$("#b-reset").onclick=function(){S={done:[],tasks:{}};save();location.reload()};
document.addEventListener("keydown",function(e){var t=e.target&&e.target.tagName;if(t==="INPUT"||t==="TEXTAREA"||t==="SELECT")return;if(e.key==="ArrowRight")$("#b-next").click();if(e.key==="ArrowLeft")$("#b-prev").click()});

/* timer */
var left=45*60,tm=null;
function showT(){var m=Math.floor(left/60),s=left%60;$("#t-show").textContent=(m<10?"0":"")+m+":"+(s<10?"0":"")+s}
$("#t-len").onchange=function(){clearInterval(tm);tm=null;$("#t-go").textContent="▶ Старт";left=+$("#t-len").value*60;showT()};
$("#t-go").onclick=function(){if(tm){clearInterval(tm);tm=null;$("#t-go").textContent="▶ Старт";return}
  $("#t-go").textContent="❚❚ Пауза";tm=setInterval(function(){left--;if(left<=0){left=0;clearInterval(tm);tm=null;$("#t-go").textContent="▶ Старт"}showT()},1000)};
$("#t-reset").onclick=function(){clearInterval(tm);tm=null;$("#t-go").textContent="▶ Старт";left=+$("#t-len").value*60;showT()};
showT();

var start=0,m=(location.hash||"").match(/^#step-(\d+)$/);
if(m)start=+m[1]-1;else if(typeof S.cur==="number")start=S.cur;
show(start);
})();
